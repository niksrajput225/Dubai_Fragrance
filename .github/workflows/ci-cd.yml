name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Permissions for GitHub Pages and GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===================================================
  # Job 1: Lint & Code Quality Validation
  # ===================================================
  lint-and-validate:
    name: Code Quality & Catalog Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          echo "Checking JavaScript syntax across all modules..."
          node --check js/products.js
          node --check js/auth.js
          node --check js/wishlist.js
          node --check js/cart.js
          node --check js/app.js
          echo "All JavaScript modules passed syntax validation!"

      - name: Validate Catalog & Pricing Rules
        run: |
          node -e '
            const fs = require("fs");
            const code = fs.readFileSync("js/products.js", "utf8");
            const fn = new Function(code + "\nreturn { PRODUCTS, getPriceForSize };");
            const { PRODUCTS, getPriceForSize } = fn();

            console.log("Validating total products count...");
            if (PRODUCTS.length !== 40) {
              throw new Error(`Expected 40 products, found ${PRODUCTS.length}`);
            }

            console.log("Validating exact doubling pricing engine...");
            PRODUCTS.filter(p => !p.fixedSize).forEach(p => {
              const p3 = getPriceForSize(p, "3ml");
              const p6 = getPriceForSize(p, "6ml");
              const p12 = getPriceForSize(p, "12ml");

              if (p6.price !== p3.price * 2) {
                throw new Error(`6ml not 2x for ${p.name}: 3ml=${p3.price}, 6ml=${p6.price}`);
              }
              if (p12.price !== p3.price * 4) {
                throw new Error(`12ml not 4x for ${p.name}: 3ml=${p3.price}, 12ml=${p12.price}`);
              }
            });

            console.log("Catalog and pricing verification passed 100%!");
          '

  # ===================================================
  # Job 2: Docker Build & Health Check Verification
  # ===================================================
  docker-build-and-test:
    name: Docker Build & Health Test
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: dubai-fragrances:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Test Container
        run: |
          docker run -d --name test-fragrances -p 8080:80 dubai-fragrances:test
          sleep 3

      - name: Verify Health Check Endpoint (/healthz)
        run: |
          echo "Testing /healthz endpoint..."
          HEALTH_RES=$(curl -s http://localhost:8080/healthz)
          echo "Health response: $HEALTH_RES"
          if [[ "$HEALTH_RES" != *"healthy"* ]]; then
            echo "Healthcheck failed!"
            exit 1
          fi

      - name: Verify Index Page Serving
        run: |
          echo "Testing index.html serving..."
          STATUS_CODE=$(curl -o /dev/null -s -w "%{http_code}\n" http://localhost:8080/)
          echo "HTTP Status: $STATUS_CODE"
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Expected HTTP 200, got $STATUS_CODE"
            exit 1
          fi

      - name: Cleanup Test Container
        if: always()
        run: |
          docker stop test-fragrances || true
          docker rm test-fragrances || true

  # ===================================================
  # Job 3: Publish Container Image to GitHub Registry (GHCR)
  # ===================================================
  docker-publish:
    name: Publish Container to GHCR
    needs: docker-build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name for Docker Tag
        id: repo_name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build & Push Production Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===================================================
  # Job 4: Automated Public Demo Deployment (GitHub Pages)
  # ===================================================
  deploy-pages:
    name: Deploy Demo to GitHub Pages
    needs: lint-and-validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Static Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
