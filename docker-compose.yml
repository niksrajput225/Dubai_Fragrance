services:
  dubai-fragrances:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dubai-fragrances-app
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - NGINX_PORT=80
